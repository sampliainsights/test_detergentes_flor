<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>Test de Fragancias FLOR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap">
<style>
:root{
  --ink:#1B2350; --ink-2:#4A5178; --muted:#7C82A3;
  --bg:#F5F6FB; --paper:#FFFFFF; --line:#DDE0EE;
  --accent:#2F55C9; --accent-soft:#E4EAFB;
  --serif:"Instrument Serif", "Cormorant Garamond", Georgia, serif;
  --sans:"DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --fr:#2F55C9;
  color-scheme: light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
.wrap{max-width:1040px;margin:0 auto;padding-inline:20px;padding-block:0 48px}

/* Top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding-block:18px;border-bottom:1px solid var(--line);margin-bottom:28px}
.brand{font-family:var(--serif);font-size:30px;letter-spacing:.02em;line-height:1;color:var(--accent)}
.brand small{display:block;font-family:var(--sans);font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.tag{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);border:1px solid var(--line);padding:6px 10px;border-radius:99px;background:var(--paper)}

h1,h2,h3{font-family:var(--serif);font-weight:400;text-wrap:balance;margin:0;letter-spacing:-.005em}
.eyebrow{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-weight:500}

/* Buttons */
.btn{appearance:none;border:0;font:inherit;font-weight:600;font-size:13px;letter-spacing:.14em;text-transform:uppercase;padding:15px 26px;border-radius:2px;cursor:pointer;transition:background .2s,color .2s,opacity .2s,transform .15s}
.btn-primary{background:var(--ink);color:#fff}
.btn-primary:hover:not(:disabled){background:var(--accent)}
.btn-primary:disabled{opacity:.28;cursor:not-allowed}
.btn-ghost{background:transparent;color:var(--ink);padding-inline:4px}
.btn-ghost:hover{color:var(--accent)}
.btn:focus-visible,.tile:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:3px}

/* Start */
.start{display:grid;grid-template-columns:1.05fr .95fr;gap:40px;align-items:center;min-height:460px}
.start h1{font-size:clamp(44px,7vw,84px);line-height:.95}
.start h1 em{color:var(--accent)}
.start p.lead{font-size:18px;color:var(--ink-2);max-width:44ch;margin:22px 0 28px}
.meta{display:flex;gap:22px;flex-wrap:wrap;margin-top:22px;font-size:13px;color:var(--muted)}
.meta b{color:var(--ink);font-weight:600}
.swatchwall{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.swatchwall div{aspect-ratio:3/4;border-radius:999px 999px 6px 6px;position:relative;overflow:hidden}
.swatchwall span{position:absolute;left:0;right:0;bottom:10px;text-align:center;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:rgba(20,24,60,.75);font-weight:600}
.prize{margin-top:26px;display:flex;gap:12px;align-items:center;font-size:14px;color:var(--ink-2);border-top:1px solid var(--line);padding-top:18px}
.prize svg{flex:none}

/* Progress */
.progress{display:flex;align-items:center;gap:0;margin:0 auto 34px;max-width:560px}
.step{display:flex;align-items:center;flex:1}
.step:last-child{flex:0}
.dot{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:var(--paper);display:grid;place-items:center;font-size:12px;font-weight:600;color:var(--muted);flex:none;transition:all .25s}
.bar{height:1px;background:var(--line);flex:1;position:relative}
.bar i{position:absolute;inset:0;background:var(--ink);transform-origin:left;transform:scaleX(0);transition:transform .35s}
.step.done .dot{background:var(--ink);border-color:var(--ink);color:#fff}
.step.done .bar i{transform:scaleX(1)}
.step.current .dot{border-color:var(--ink);color:var(--ink);box-shadow:0 0 0 4px var(--accent-soft)}
.finish{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-left:10px;font-weight:600}

/* Question */
.q-head{text-align:center;margin-bottom:30px}
.q-head .eyebrow{margin-bottom:10px;display:block}
.q-head h2{font-size:clamp(30px,4.4vw,46px);line-height:1.08;max-width:22ch;margin-inline:auto}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;max-width:900px;margin:0 auto}
.tile{appearance:none;font:inherit;color:inherit;text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:4px;padding:10px;cursor:pointer;display:flex;flex-direction:column;gap:14px;transition:border-color .2s,transform .2s,box-shadow .2s}
.tile:hover{transform:translateY(-3px);box-shadow:0 14px 30px -18px rgba(27,35,80,.35)}
.tile .art{aspect-ratio:4/3;border-radius:2px;position:relative;overflow:hidden}
.tile .art .glyph{position:absolute;right:12px;bottom:10px;font-family:var(--serif);font-style:italic;font-size:44px;line-height:1;color:rgba(255,255,255,.9);text-shadow:0 1px 12px rgba(0,0,0,.08)}
.tile .txt{padding:0 6px 8px;display:flex;gap:12px;align-items:flex-start}
.tile .radio{width:18px;height:18px;border-radius:50%;border:1.5px solid var(--line);flex:none;margin-top:2px;position:relative;transition:border-color .2s}
.tile .label{font-size:15.5px;line-height:1.4}
.tile .label b{display:block;font-weight:600;font-size:16px;margin-bottom:2px}
.tile[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.tile[aria-pressed="true"] .radio{border-color:var(--ink)}
.tile[aria-pressed="true"] .radio::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--ink)}
.nav{display:flex;justify-content:space-between;align-items:center;max-width:900px;margin:30px auto 0}

/* Result */
.result{display:grid;grid-template-columns:.9fr 1.1fr;gap:44px;align-items:start}
.bottle-stage{background:linear-gradient(180deg,color-mix(in srgb,var(--fr) 16%,#fff),color-mix(in srgb,var(--fr) 34%,#fff));border-radius:4px;aspect-ratio:4/5;display:grid;place-items:center;position:relative;overflow:hidden}
.bottle-stage::before{content:"";position:absolute;width:70%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.85),rgba(255,255,255,0) 70%);top:12%}
.bottle-stage svg{position:relative;width:52%;height:auto;filter:drop-shadow(0 24px 30px rgba(27,35,80,.22))}
.proto{position:absolute;left:12px;bottom:10px;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:rgba(27,35,80,.55)}
.result .eyebrow{display:block;margin-bottom:8px}
.result h2{font-size:clamp(40px,5.6vw,64px);line-height:.98}
.result h2 em{color:var(--fr)}
.family{display:inline-block;margin-top:14px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:600;color:var(--fr);background:color-mix(in srgb,var(--fr) 12%,#fff);padding:6px 10px;border-radius:99px}
.result p.desc{font-size:17px;color:var(--ink-2);max-width:52ch;margin:20px 0 26px}
.pyramid{border-top:1px solid var(--line)}
.pyramid div{display:grid;grid-template-columns:110px 1fr;gap:16px;padding:13px 0;border-bottom:1px solid var(--line);font-size:15px}
.pyramid dt{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);font-weight:600;padding-top:3px}
.pyramid dd{margin:0}
.combo{display:flex;align-items:center;gap:14px;margin:22px 0 0;padding:14px 16px;background:var(--paper);border:1px solid var(--line);border-radius:4px;font-size:14.5px}
.combo .chip{width:34px;height:34px;border-radius:50%;flex:none}
.combo b{font-weight:600}
.sorteo{margin-top:28px;padding:24px;background:var(--ink);color:#fff;border-radius:4px;display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.sorteo h3{font-size:28px;line-height:1.1}
.sorteo p{margin:6px 0 16px;color:rgba(255,255,255,.75);font-size:14.5px}
.sorteo .btn{background:#fff;color:var(--ink)}
.sorteo .btn:hover{background:var(--accent-soft)}
.after{display:flex;gap:18px;flex-wrap:wrap;margin-top:16px}

/* Form */
.form-wrap{max-width:560px;margin:0 auto}
.form-wrap h2{font-size:clamp(34px,5vw,52px);line-height:1.02;text-align:center}
.form-wrap .sub{text-align:center;color:var(--ink-2);margin:12px auto 28px;max-width:46ch}
form{display:grid;gap:16px;background:var(--paper);border:1px solid var(--line);padding:26px;border-radius:4px}
label.f{display:grid;gap:6px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;font-weight:600;color:var(--ink-2)}
input[type=text],input[type=email],input[type=file]{font:inherit;font-size:15px;letter-spacing:0;text-transform:none;font-weight:400;color:var(--ink);border:1px solid var(--line);border-radius:2px;padding:12px 14px;background:var(--bg);width:100%}
.check{display:flex;gap:10px;font-size:13.5px;color:var(--ink-2);align-items:flex-start}
.check input{margin-top:3px;accent-color:var(--ink)}
.err{color:#B3261E;font-size:13px;min-height:1em}
.note{font-size:12px;color:var(--muted);text-align:center;margin-top:14px}
.done{text-align:center;max-width:520px;margin:30px auto}
.done h2{font-size:clamp(36px,5vw,56px)}
.done p{color:var(--ink-2)}

/* Reviewer panel */
.review{max-width:900px;margin:40px auto 0;font-size:13px;color:var(--ink-2)}
.review summary{cursor:pointer;font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:600;color:var(--muted)}
.scores{display:grid;gap:6px;margin-top:14px}
.scores .row{display:grid;grid-template-columns:170px 1fr 40px;gap:12px;align-items:center;font-variant-numeric:tabular-nums}
.scores .track{height:8px;background:var(--line);border-radius:99px;overflow:hidden}
.scores .track i{display:block;height:100%;border-radius:99px}
.scores .row.win{font-weight:600;color:var(--ink)}

.screen{animation:in .45s ease both}
@keyframes in{from{opacity:.001;transform:translateY(10px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.screen{animation:none}.tile,.bar i{transition:none}}

@media (max-width:820px){
  .start,.result{grid-template-columns:1fr;gap:28px}
  .start{min-height:0}
  .swatchwall{order:-1;grid-template-columns:repeat(8,1fr);gap:6px}
  .swatchwall div{aspect-ratio:1/2.2}
  .swatchwall span{display:none}
  .tiles{grid-template-columns:1fr;gap:12px}
  .tile{flex-direction:row;align-items:center}
  .tile .art{width:96px;flex:none;aspect-ratio:1}
  .tile .art .glyph{font-size:30px;right:8px;bottom:4px}
  .tile .txt{padding:0}
  .bottle-stage{aspect-ratio:5/4}
  .bottle-stage svg{width:30%}
  .sorteo{grid-template-columns:1fr}
  .pyramid div{grid-template-columns:90px 1fr}
  .scores .row{grid-template-columns:120px 1fr 32px}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">Flor<small>Test de fragancias</small></div>
    <span class="tag">Sorteo Smartbox SPA</span>
  </header>
  <main id="app"></main>
</div>

<script>
const FR = {
  azul:{name:"Flor Azul",short:"Azul",family:"Fresco · Limpio",color:"#2F55C9",perf:"Azul",perfColor:"#3E7BE0",
    title:"Frescor que te acompaña",
    desc:"Tu aroma es luz y aire limpio. Una salida fresca y chispeante se abre a un corazón de flor de azahar y termina en un fondo amaderado y suave. Es para quienes quieren sentir la ropa recién lavada durante todo el día.",
    top:"Frescor, aldehídos",mid:"Floral, frutal, flor de azahar",base:"Amaderado, almizcle"},
  nenuco:{name:"Flor Nenuco",short:"Nenuco",family:"Fresco · Limpio",color:"#6FA3DB",perf:"Azul",perfColor:"#3E7BE0",
    title:"El aroma que te hace sentir en casa",
    desc:"Hay olores que son un abrazo. Notas de colonia, lavanda y un toque cítrico se funden en un fondo almizclado y tierno. Es una fragancia reconfortante que convierte cada prenda en un pequeño refugio.",
    top:"Frescor, colonia",mid:"Floral, cítrico, lavanda",base:"Almizcle"},
  original:{name:"Flor Original",short:"Original",family:"Fresco · Limpio",color:"#3D4FA0",perf:"Azul",perfColor:"#3E7BE0",
    title:"El olor a limpio de siempre",
    desc:"Es el aroma que reconocerías con los ojos cerrados. Jazmín y flores blancas se mezclan con rosa y melocotón sobre un fondo amaderado. Una fragancia clásica que nunca falla.",
    top:"Frescor, aldehídos, jazmín",mid:"Flores blancas, rosa, melocotón",base:"Amaderado, almizcle"},
  medit:{name:"Flor Mediterráneo",short:"Mediterráneo",family:"Natural · Oceánico · Herbal",color:"#1F9A92",perf:"Azul",perfColor:"#3E7BE0",
    title:"Brisa, hierbas y horizonte",
    desc:"Tu fragancia huele a costa. La albahaca y la bergamota abren paso a un corazón herbal con lirio y manzana, y un fondo de ámbar y musgo la hace natural y envolvente. Es como una escapada junto al mar cada vez que abres el armario.",
    top:"Frescor, albahaca, bergamota",mid:"Herbal, lirio, manzana",base:"Ámbar, almizcle, musgo"},
  cerezo:{name:"Flor de Cerezo y Frambuesa",short:"Cerezo y Frambuesa",family:"Frutal",color:"#D63F72",perf:"Rosa",perfColor:"#E27AA6",
    title:"Un estallido de color",
    desc:"Frambuesa, cassis y mandarina dan una salida jugosa. Le sigue un corazón de rosa y albaricoque, y todo se asienta sobre madera y vainilla. Es dulce y vivaz, para ponerle color a la rutina.",
    top:"Frambuesa, cassis, mandarina",mid:"Floral, albaricoque, rosa",base:"Amaderado, vainilla"},
  delicias:{name:"Flor Delicias de Verano",short:"Delicias de Verano",family:"Frutal",color:"#E8834A",perf:"Tropical",perfColor:"#F2A93B",
    title:"El verano, embotellado",
    desc:"Hojas verdes y un toque empolvado dan paso a melocotón y albaricoque, que se funden con un fondo cremoso de vainilla y leche. Es sol, vacaciones y piel cálida en cada prenda.",
    top:"Hojas verdes, empolvado",mid:"Melocotón, albaricoque, floral",base:"Vainilla, almizcle, leche"},
  pieles:{name:"Flor Pieles Sensibles",short:"Pieles Sensibles",family:"Floral · Delicado",color:"#B88BC0",perf:"Rosa",perfColor:"#E27AA6",
    title:"La delicadeza hecha aroma",
    desc:"Es una fragancia suave y empolvada, con un fondo de lavanda, que envuelve sin imponerse. Es para quienes buscan una sensación de cuidado y ternura en contacto con la piel.",
    top:"Fragancia delicada",mid:"Empolvado",base:"Lavanda"},
  orquidea:{name:"Flor Orquídea Blanca",short:"Orquídea Blanca",family:"Floral · Perfumista",color:"#7A5BB8",perf:"Rosa",perfColor:"#E27AA6",
    title:"Una estela que se recuerda",
    desc:"Tu fragancia es la más perfumista. La bergamota y la mandarina se abren a un corazón de magnolia con matices verdes y mentolados. Termina en un fondo oriental de sándalo, ámbar, iris y violeta. Es elegante, sofisticada e inolvidable.",
    top:"Bergamota, mandarina, aldehídos, lavandín",mid:"Herbal, verde-frutal, eucalipto, menta, magnolia",base:"Sándalo, ámbar, violeta, jazmín, iris"}
};
// Perfil de respuestas por fragancia (P1..P5)
const SIG = {azul:"ABABA",nenuco:"AAAAA",original:"ABBAA",medit:"ABCBB",pieles:"BAAAC",orquidea:"BCCCC",cerezo:"CCBCB",delicias:"CABBB"};
const W = [2,2,2,1,1];
const ORDER = ["nenuco","pieles","original","azul","medit","cerezo","delicias","orquidea"];

const Q = [
  {kind:"La fragancia",q:"¿Qué tipo de aroma te atrae más?",opts:[
    {t:"Fresco y limpio",s:"Como ropa recién tendida al sol.",art:"radial-gradient(circle at 30% 30%,#fff 0 18%,transparent 45%),linear-gradient(160deg,#DCEBFF,#8DB6F2 70%,#5B86D9)",g:"aire"},
    {t:"Floral y envolvente",s:"Como un jardín en flor.",art:"radial-gradient(circle at 70% 35%,#fff 0 12%,transparent 40%),radial-gradient(circle at 25% 75%,#F6C9DD,transparent 55%),linear-gradient(160deg,#EDE3F7,#C3A6E0 75%,#9A7BCB)",g:"flor"},
    {t:"Frutal y dulce",s:"Como fruta madura en pleno verano.",art:"radial-gradient(circle at 35% 40%,#FFE3C4 0 16%,transparent 45%),radial-gradient(circle at 75% 70%,#F47C8F,transparent 55%),linear-gradient(160deg,#FFD9BF,#F6A07A 70%,#E76A6A)",g:"fruta"}]},
  {kind:"La fragancia",q:"¿Cómo te gusta que se sienta una fragancia?",opts:[
    {t:"Suave y reconfortante",s:"Cerca de la piel, como un abrazo.",art:"radial-gradient(circle at 50% 50%,#fff 0 25%,transparent 65%),linear-gradient(160deg,#F7EEF3,#E4D2E6 80%)",g:"suave"},
    {t:"Fresca y ligera",s:"Que te acompañe todo el día.",art:"linear-gradient(115deg,transparent 40%,rgba(255,255,255,.7) 50%,transparent 60%),linear-gradient(160deg,#E2F4F6,#9FD6DA 70%,#62B2BD)",g:"ligera"},
    {t:"Intensa y duradera",s:"Que deje estela a tu paso.",art:"radial-gradient(circle at 70% 30%,#E9B6FF 0 10%,transparent 40%),linear-gradient(160deg,#6C4FA6,#3E2F7A 70%,#221B4E)",g:"estela"}]},
  {kind:"La fragancia",q:"Elige los ingredientes que más te inspiran",opts:[
    {t:"Lavanda, azahar y almizcle blanco",s:"Limpios, serenos y luminosos.",art:"repeating-linear-gradient(80deg,rgba(255,255,255,.35) 0 6px,transparent 6px 22px),linear-gradient(160deg,#E4E3F8,#A9A6E0 70%,#7E7BC8)",g:"lavanda"},
    {t:"Jazmín, rosa y frutas jugosas",s:"Pétalos y fruta madura.",art:"radial-gradient(circle at 30% 35%,#FFF1F4 0 10%,transparent 30%),radial-gradient(circle at 68% 60%,#FF9DB3 0 18%,transparent 45%),linear-gradient(160deg,#FFE4E8,#F7A8B8 70%,#E0708D)",g:"rosa"},
    {t:"Bergamota, hierbas y maderas",s:"Verde, aromático y natural.",art:"repeating-linear-gradient(135deg,rgba(255,255,255,.18) 0 3px,transparent 3px 16px),linear-gradient(160deg,#DDEFD9,#98C6A0 65%,#4E8E7A)",g:"hierba"}]},
  {kind:"Tú",q:"Tu plan perfecto para desconectar es…",opts:[
    {t:"En casa",s:"Con calma y con los tuyos.",art:"radial-gradient(circle at 50% 110%,#FFD9A8 0 30%,transparent 60%),linear-gradient(180deg,#F5EFE9,#E8D8C8)",g:"hogar"},
    {t:"Al aire libre",s:"Mar, sol o una escapada improvisada.",art:"linear-gradient(180deg,#BFE3F5 0 55%,#62B8C9 55% 72%,#F2DDB4 72%)",g:"mar"},
    {t:"Con amigos o en una noche especial",s:"Planes que se recuerdan.",art:"radial-gradient(circle at 25% 30%,#FFE59A 0 3%,transparent 4%),radial-gradient(circle at 70% 20%,#FFE59A 0 2%,transparent 3%),radial-gradient(circle at 55% 45%,#fff 0 2%,transparent 3%),linear-gradient(170deg,#3A2F6B,#7A3D78 70%,#C9587B)",g:"noche"}]},
  {kind:"Tú",q:"¿Con qué frase te identificas más?",opts:[
    {t:"“Lo sencillo es lo que mejor funciona.”",s:"",art:"linear-gradient(160deg,#F4F6FB,#D6DDF0)",g:"simple"},
    {t:"“Que no falten la libertad ni los planes improvisados.”",s:"",art:"linear-gradient(160deg,#FFE9CF,#F9B98A 60%,#EE8C6A)",g:"libre"},
    {t:"“Los pequeños detalles lo cambian todo.”",s:"",art:"linear-gradient(160deg,#F1E6F5,#CDB2DD 70%,#A585C4)",g:"detalle"}]}
];

const app = document.getElementById("app");
let answers = Array(Q.length).fill(null);
let idx = -1; // -1 start, 0..4 questions, 5 result, 6 form, 7 done

function score(){
  const sc = {};
  for(const k in SIG){ sc[k]=0; for(let i=0;i<Q.length;i++){ if(SIG[k][i]===answers[i]) sc[k]+=W[i]; } }
  const max = Math.max(...Object.values(sc));
  let tied = ORDER.filter(k=>sc[k]===max);
  for(const q of [2,1,0]){ if(tied.length>1){ const t2=tied.filter(k=>SIG[k][q]===answers[q]); if(t2.length) tied=t2; } }
  return {win:tied[0], sc};
}

function progress(){
  let h='<nav class="progress" aria-label="Progreso">';
  for(let i=0;i<Q.length;i++){
    const cls = i<idx?"done":(i===idx?"current":"");
    h+=`<div class="step ${cls}"><span class="dot">${i+1}</span>${i<Q.length-1?'<span class="bar"><i></i></span>':''}</div>`;
  }
  return h+'<span class="finish">Tu fragancia</span></nav>';
}

function bottle(color){
  return `<svg viewBox="0 0 200 320" aria-hidden="true">
    <defs><linearGradient id="bg" x1="0" x2="1"><stop offset="0" stop-color="${color}" stop-opacity=".78"/><stop offset=".45" stop-color="${color}"/><stop offset="1" stop-color="${color}" stop-opacity=".85"/></linearGradient>
    <linearGradient id="sh" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity=".0"/><stop offset=".5" stop-color="#fff" stop-opacity=".45"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient></defs>
    <rect x="72" y="8" width="56" height="34" rx="6" fill="#F3F4FA"/>
    <rect x="72" y="36" width="56" height="8" fill="#DADDEA"/>
    <path d="M78 44 h44 v18 c34 10 52 32 52 64 v150 c0 20 -14 34 -34 34 h-80 c-20 0 -34 -14 -34 -34 v-150 c0 -32 18 -54 52 -64 z" fill="url(#bg)"/>
    <path d="M150 110 c8 16 10 30 10 44 v110" stroke="url(#sh)" stroke-width="10" fill="none" stroke-linecap="round"/>
    <rect x="44" y="140" width="112" height="112" rx="10" fill="#fff" fill-opacity=".94"/>
    <text x="100" y="192" text-anchor="middle" font-family="Instrument Serif, Georgia, serif" font-size="40" fill="${color}">Flor</text>
    <text x="100" y="222" text-anchor="middle" font-family="DM Sans, sans-serif" font-size="10" letter-spacing="2" fill="#4A5178">SUAVIZANTE</text>
  </svg>`;
}

function render(){
  window.scrollTo(0,0);
  if(idx===-1) return renderStart();
  if(idx<Q.length) return renderQ();
  if(idx===Q.length) return renderResult();
  if(idx===Q.length+1) return renderForm();
  return renderDone();
}

function renderStart(){
  const sw = ORDER.map(k=>`<div style="background:linear-gradient(180deg,color-mix(in srgb,${FR[k].color} 22%,#fff),${FR[k].color})"><span>${FR[k].short}</span></div>`).join("");
  app.innerHTML = `<section class="screen start">
    <div>
      <span class="eyebrow">Nueva gama FLOR</span>
      <h1 style="margin-top:14px">Descubre tu <em>fragancia</em> FLOR</h1>
      <p class="lead">Cada aroma cuenta una historia. Responde 5 preguntas sobre lo que te hace sentir bien y descubre la fragancia que tu ropa estaba esperando.</p>
      <button class="btn btn-primary" id="go">Empezar el test</button>
      <div class="meta"><span><b>2 min</b> de duración</span><span><b>5</b> preguntas</span><span><b>8</b> fragancias</span></div>
      <div class="prize">
        <svg width="36" height="36" viewBox="0 0 36 36" aria-hidden="true"><circle cx="18" cy="18" r="17" fill="#E4EAFB"/><path d="M11 16h14v10H11zM9 12h18v4H9zM18 12v14" stroke="#1B2350" stroke-width="1.5" fill="none"/><path d="M18 12c-2-4-7-4-6-1s6 1 6 1c0 0 5 2 6-1s-4-3-6 1" stroke="#1B2350" stroke-width="1.5" fill="none"/></svg>
        <span>Compra un suavizante Flor y participa en el sorteo de una <br>Smartbox SPA <b>valorada en 79,90€.</b></span>
      </div>
    </div>
    <div class="swatchwall" aria-hidden="true">${sw}</div>
  </section>`;
  document.getElementById("go").onclick=()=>{idx=0;render();};
}

function renderQ(){
  const q = Q[idx];
  const tiles = q.opts.map((o,i)=>{
    const L="ABC"[i]; const on = answers[idx]===L;
    return `<button class="tile" data-l="${L}" aria-pressed="${on}">
      <div class="art" style="background:${o.art}"><span class="glyph">${o.g}</span></div>
      <div class="txt"><span class="radio"></span><span class="label"><b>${o.t}</b>${o.s}</span></div>
    </button>`;}).join("");
  app.innerHTML = `<section class="screen">
    ${progress()}
    <div class="q-head"><span class="eyebrow">Pregunta ${idx+1} de ${Q.length} · ${q.kind}</span><h2>${q.q}</h2></div>
    <div class="tiles" role="group" aria-label="${q.q}">${tiles}</div>
    <div class="nav">
      <button class="btn btn-ghost" id="prev">← Anterior</button>
      <button class="btn btn-primary" id="next" ${answers[idx]?"":"disabled"}>${idx===Q.length-1?"Ver mi fragancia":"Siguiente"}</button>
    </div>
  </section>`;
  app.querySelectorAll(".tile").forEach(b=>b.onclick=()=>{
    answers[idx]=b.dataset.l;
    app.querySelectorAll(".tile").forEach(x=>x.setAttribute("aria-pressed",x===b));
    document.getElementById("next").disabled=false;
  });
  document.getElementById("prev").onclick=()=>{idx--;render();};
  document.getElementById("next").onclick=()=>{if(answers[idx]){idx++;render();}};
}

function renderResult(){
  const {win,sc} = score(); const f = FR[win];
  document.documentElement.style.setProperty("--fr",f.color);
  const maxPts = W.reduce((a,b)=>a+b,0);
  const rows = Object.keys(sc).sort((a,b)=>sc[b]-sc[a]).map(k=>`<div class="row ${k===win?'win':''}"><span>${FR[k].short}</span><span class="track"><i style="width:${sc[k]/maxPts*100}%;background:${FR[k].color}"></i></span><span>${sc[k]}/${maxPts}</span></div>`).join("");
  app.innerHTML = `<section class="screen">
    <div class="result">
      <div class="bottle-stage">${bottle(f.color)}<span class="proto">Imagen de producto provisional</span></div>
      <div>
        <span class="eyebrow">Tu fragancia es</span>
        <h2>${f.name.replace("Flor","Flor <em>")}</em></h2>
        <span class="family">${f.family}</span>
        <p class="desc"><b style="color:var(--ink)">${f.title}.</b> ${f.desc}</p>
        <dl class="pyramid">
          <div><dt>Salida</dt><dd>${f.top}</dd></div>
          <div><dt>Corazón</dt><dd>${f.mid}</dd></div>
          <div><dt>Fondo</dt><dd>${f.base}</dd></div>
        </dl>
        <div class="combo"><span class="chip" style="background:${f.perfColor}"></span><span>Potencia su aroma combinándolo con <b>Flor Perfumador ${f.perf}</b>.</span></div>
        <div class="sorteo">
          <svg width="54" height="54" viewBox="0 0 36 36" aria-hidden="true"><circle cx="18" cy="18" r="17" fill="rgba(255,255,255,.12)"/><path d="M11 16h14v10H11zM9 12h18v4H9zM18 12v14" stroke="#fff" stroke-width="1.4" fill="none"/><path d="M18 12c-2-4-7-4-6-1s6 1 6 1c0 0 5 2 6-1s-4-3-6 1" stroke="#fff" stroke-width="1.4" fill="none"/></svg>
          <div>
            <h3>Gana una Smartbox SPA</h3>
            <p>Compra un suavizante Flor y participa en el sorteo de una Smartbox SPA valorada en 79,90€.</p>
            <button class="btn" id="toForm">Participar en el sorteo</button>
          </div>
        </div>
        <div class="after">
          <button class="btn btn-ghost" id="redo">↺ Repetir el test</button>
        </div>
      </div>
    </div>
    <details class="review"><summary>Revisión interna · ver puntuación</summary>
      <p style="margin:10px 0 0">Respuestas: ${answers.map((a,i)=>`P${i+1} ${a}`).join(" · ")}. P1 a P3 suman 2 puntos y P4 y P5 suman 1.</p>
      <div class="scores">${rows}</div>
    </details>
  </section>`;
  document.getElementById("toForm").onclick=()=>{idx++;render();};
  document.getElementById("redo").onclick=reset;
}

function renderForm(){
  const f = FR[score().win];
  app.innerHTML = `<section class="screen form-wrap">
    <span class="eyebrow" style="display:block;text-align:center;margin-bottom:10px">Sorteo Smartbox SPA</span>
    <h2>Participa con tu ${f.short}</h2>
    <p class="sub">Rellena tus datos y sube una foto del ticket de compra de cualquier suavizante FLOR.</p>
    <form id="f" novalidate>
      <label class="f" for="nombre">Nombre y apellidos<input type="text" id="nombre" autocomplete="name" placeholder="Laura García"></label>
      <label class="f" for="email">Email<input type="email" id="email" autocomplete="email" placeholder="laura@email.com"></label>
      <label class="f" for="ticket">Ticket de compra<input type="file" id="ticket" accept="image/*,.pdf"></label>
      <label class="check" for="bases"><input type="checkbox" id="bases"> <span>He leído y acepto las bases legales del sorteo y la política de privacidad.</span></label>
      <div class="err" id="err" role="alert"></div>
      <button class="btn btn-primary" type="submit">Enviar participación</button>
      <button class="btn btn-ghost" type="button" id="back">← Volver a mi resultado</button>
    </form>
    <p class="note">Prototipo: este formulario no envía datos.</p>
  </section>`;
  document.getElementById("back").onclick=()=>{idx--;render();};
  document.getElementById("f").addEventListener("submit",e=>{
    e.preventDefault();
    const n=document.getElementById("nombre").value.trim(), m=document.getElementById("email").value.trim();
    const t=document.getElementById("ticket").files.length, b=document.getElementById("bases").checked;
    const err=document.getElementById("err");
    if(!n) return err.textContent="Escribe tu nombre para participar.";
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(m)) return err.textContent="Revisa el email: parece que le falta algo.";
    if(!t) return err.textContent="Sube una foto de tu ticket de compra.";
    if(!b) return err.textContent="Acepta las bases legales para continuar.";
    idx++;render();
  });
}

function renderDone(){
  app.innerHTML = `<section class="screen done">
    <span class="eyebrow">Sorteo Smartbox SPA</span>
    <h2 style="margin:12px 0">¡Ya estás participando!</h2>
    <p>En la landing real aquí se confirmaría la participación y se enviaría un email. Mucha suerte.</p>
    <div style="margin-top:24px"><button class="btn btn-primary" id="redo">Volver al inicio</button></div>
    <p class="note">Prototipo: no se ha enviado ningún dato.</p>
  </section>`;
  document.getElementById("redo").onclick=reset;
}

function reset(){answers=Array(Q.length).fill(null);idx=-1;document.documentElement.style.setProperty("--fr","#2F55C9");render();}
render();
</script>
</body>
</html>
